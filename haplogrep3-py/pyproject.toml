[project]
name = "haplogrep3"
version = "0.1.0"
description = "mtDNA haplogroup classification tool"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "pydantic>=2.0",
    "cyvcf2>=0.30.0",
    "biopython>=1.80",
    "pyyaml>=6.0",
    "rich>=13.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    "duckdb>=1.0.0",
]

[project.scripts]
haplogrep3 = "haplogrep3.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/haplogrep3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]
